{{- include "autodeploy-control-plane.validateRuntime" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "autodeploy-control-plane.fullname" . }}-worker
  labels:
    {{- include "autodeploy-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "autodeploy-control-plane.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "autodeploy-control-plane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "autodeploy-control-plane.serviceAccountName" . }}
      automountServiceAccountToken: {{ empty .Values.kubeconfig.existingSecret }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "autodeploy-control-plane.runtimePodSecurityContext" . | nindent 8 }}
      {{- if .Values.workspace.initPermissions.enabled }}
      initContainers:
        {{- include "autodeploy-control-plane.workspaceInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "flask", "--app", "wsgi:app", "run-worker"]
          envFrom:
            - configMapRef:
                name: {{ include "autodeploy-control-plane.fullname" . }}-config
          env:
            {{- include "autodeploy-control-plane.secretEnv" (dict "root" . "component" "worker") | nindent 12 }}
            - name: CONTROL_PLANE_COMPONENT
              value: worker
          {{- if .Values.kubeconfig.existingSecret }}
            - name: CONTROL_PLANE_KUBECONFIG
              value: {{ printf "%s/%s" .Values.kubeconfig.mountPath .Values.kubeconfig.fileName | quote }}
          {{- end }}
          livenessProbe:
            exec:
              command: ["python", "-c", "import os; os.kill(1, 0)"]
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["python", "-m", "flask", "--app", "wsgi:app", "check-worker-readiness"]
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: workspace
              mountPath: {{ include "autodeploy-control-plane.workspaceMountPath" . }}
            {{- if .Values.dockerSocket.enabled }}
            - name: docker-socket
              mountPath: /var/run/docker.sock
            {{- end }}
            {{- if .Values.kubeconfig.existingSecret }}
            - name: kubeconfig
              mountPath: {{ .Values.kubeconfig.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        - name: workspace
          {{- include "autodeploy-control-plane.workspaceVolume" . | nindent 10 }}
        {{- if .Values.dockerSocket.enabled }}
        - name: docker-socket
          hostPath:
            path: {{ .Values.dockerSocket.hostPath }}
            type: Socket
        {{- end }}
        {{- if .Values.kubeconfig.existingSecret }}
        - name: kubeconfig
          secret:
            secretName: {{ .Values.kubeconfig.existingSecret }}
        {{- end }}
