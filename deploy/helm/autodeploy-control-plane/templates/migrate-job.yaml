apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "autodeploy-control-plane.fullname" . }}-migrate
  labels:
    {{- include "autodeploy-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "autodeploy-control-plane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.workspace.initPermissions.enabled }}
      initContainers:
        {{- include "autodeploy-control-plane.workspaceInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "flask", "--app", "wsgi:app", "db", "upgrade"]
          env:
            {{- range $key, $value := .Values.config }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.secrets.create }}
            {{- range $key, $value := .Values.secrets.values }}
            {{- if ne ($value | toString) "" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
            {{- else }}
          envFrom:
            - secretRef:
                name: {{ include "autodeploy-control-plane.runtimeSecretName" . }}
            {{- end }}
          volumeMounts:
            - name: workspace
              mountPath: {{ include "autodeploy-control-plane.workspaceMountPath" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      volumes:
        - name: workspace
          {{- include "autodeploy-control-plane.workspaceVolume" . | nindent 10 }}
