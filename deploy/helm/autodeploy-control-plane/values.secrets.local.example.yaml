# Copy this file to values.secrets.local.yaml, restrict it to mode 0600,
# and replace the placeholders. The copied file is ignored by Git.
# Values in this file are plaintext and are intended only for a local,
# trusted environment. See docs/runbook.md and docs/security.md.
secrets:
  create: true
  existingSecret: ""
  # Chart-managed non-empty Git token keys are detected automatically. When
  # existingSecret is used, list those keys explicitly under gitTokenKeys.
  gitTokenKeys: []
  values:
    CONTROL_PLANE_DATABASE_URL: mysql+pymysql://control_plane_user:replace-me@mysql:3306/control_plane
    CONTROL_PLANE_GITHUB_WEBHOOK_SECRET: replace-me
    CONTROL_PLANE_API_TOKEN_READ_ONLY: replace-me
    CONTROL_PLANE_API_TOKEN_DEPLOYER: replace-me
    CONTROL_PLANE_API_TOKEN_ADMIN: replace-me
    CONTROL_PLANE_API_TOKENS_JSON: ""
    CONTROL_PLANE_REGISTRY_USERNAME: replace-me
    CONTROL_PLANE_REGISTRY_PASSWORD: replace-me
    CONTROL_PLANE_METRICS_TOKEN: replace-me-only-when-metrics-are-enabled
    CONTROL_PLANE_GIT_TOKEN_GITHUB: replace-me-only-for-private-repositories
