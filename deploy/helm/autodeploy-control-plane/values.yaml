nameOverride: ""
fullnameOverride: ""

image:
  repository: autodeploy-control-plane
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

rbac:
  create: true
  helmReleaseStorage: false

service:
  type: ClusterIP
  port: 5000

api:
  replicaCount: 1

worker:
  replicaCount: 1

reconciler:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1

config:
  CONTROL_PLANE_ENV: production
  CONTROL_PLANE_EXECUTOR: fake
  CONTROL_PLANE_WORKSPACE_ROOT: /tmp/paas-workspaces
  CONTROL_PLANE_COMMAND_TIMEOUT_SECONDS: "600"
  CONTROL_PLANE_COMMAND_RETRY_COUNT: "1"
  CONTROL_PLANE_MAX_CONTENT_LENGTH: "2097152"
  CONTROL_PLANE_TRUSTED_PROXY_COUNT: "0"
  CONTROL_PLANE_REGISTRY_ENABLED: "false"
  CONTROL_PLANE_REGISTRY_URL: ""
  CONTROL_PLANE_REGISTRY_NAMESPACE: ""
  CONTROL_PLANE_ALLOW_AUTH_DISABLED: "false"
  CONTROL_PLANE_K8S_NAMESPACE: default
  CONTROL_PLANE_K8S_IMAGE_PULL_SECRET: ""
  CONTROL_PLANE_K8S_DEPLOYMENT_MODE: manifest
  CONTROL_PLANE_K8S_HELM_CHART_PATH: deploy/helm/generic-web-app
  CONTROL_PLANE_K8S_HELM_BINARY: helm
  CONTROL_PLANE_K8S_HELM_TIMEOUT: 180s
  CONTROL_PLANE_K8S_INGRESS_ENABLED: "false"
  CONTROL_PLANE_K8S_INGRESS_CLASS_NAME: ""
  CONTROL_PLANE_K8S_INGRESS_BASE_DOMAIN: 127.0.0.1.nip.io
  CONTROL_PLANE_DEPLOY_HOST: host.docker.internal
  CONTROL_PLANE_HEALTHCHECK_TIMEOUT_SECONDS: "30"
  CONTROL_PLANE_K8S_ROLLOUT_TIMEOUT_SECONDS: "120"
  CONTROL_PLANE_HEALTHCHECK_INTERVAL_SECONDS: "1"
  CONTROL_PLANE_WORKER_POLL_INTERVAL_SECONDS: "5"
  CONTROL_PLANE_RECONCILER_POLL_INTERVAL_SECONDS: "60"
  CONTROL_PLANE_CLAIM_TTL_SECONDS: "300"
  CONTROL_PLANE_CLAIM_REFRESH_INTERVAL_SECONDS: "30"
  CONTROL_PLANE_METRICS_ENABLED: "false"
  CONTROL_PLANE_LOG_FORMAT: json
  PORT: "5000"

secrets:
  create: true
  existingSecret: ""
  values:
    CONTROL_PLANE_DATABASE_URL: ""
    CONTROL_PLANE_GITHUB_WEBHOOK_SECRET: ""
    CONTROL_PLANE_API_TOKEN_READ_ONLY: ""
    CONTROL_PLANE_API_TOKEN_DEPLOYER: ""
    CONTROL_PLANE_API_TOKEN_ADMIN: ""
    CONTROL_PLANE_API_TOKENS_JSON: ""
    CONTROL_PLANE_REGISTRY_USERNAME: ""
    CONTROL_PLANE_REGISTRY_PASSWORD: ""
    CONTROL_PLANE_METRICS_TOKEN: ""

resources: {}

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

imagePullSecrets: []

workspace:
  type: persistentVolumeClaim
  existingClaim: ""
  hostPath: ""
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  size: 2Gi
  initPermissions:
    enabled: false
    user: "1000"
    group: "1000"

dockerSocket:
  enabled: false
  hostPath: /var/run/docker.sock
  groupId: ""

kubeconfig:
  existingSecret: ""
  secretKey: config
  mountPath: /var/run/control-plane/kubeconfig
  fileName: config
