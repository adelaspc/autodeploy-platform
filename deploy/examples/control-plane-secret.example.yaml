apiVersion: v1
kind: Secret
metadata:
  name: autodeploy-control-plane-secret-example
type: Opaque
stringData:
  CONTROL_PLANE_DATABASE_URL: mysql+pymysql://control_plane_user:replace-me@mysql:3306/control_plane
  CONTROL_PLANE_GITHUB_WEBHOOK_SECRET: replace-me
  CONTROL_PLANE_API_TOKEN_READ_ONLY: replace-me
  CONTROL_PLANE_API_TOKEN_DEPLOYER: replace-me
  CONTROL_PLANE_API_TOKEN_ADMIN: replace-me
  CONTROL_PLANE_REGISTRY_USERNAME: replace-me
  CONTROL_PLANE_REGISTRY_PASSWORD: replace-me
  CONTROL_PLANE_METRICS_TOKEN: replace-me-only-when-metrics-are-enabled
