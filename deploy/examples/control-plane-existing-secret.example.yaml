# Example for secrets.create=false. Apply and manage this Secret outside the
# Helm release, then set secrets.existingSecret to its metadata.name.
apiVersion: v1
kind: Secret
metadata:
  name: autodeploy-control-plane-runtime
type: Opaque
stringData:
  CONTROL_PLANE_DATABASE_URL: mysql+pymysql://control_plane_user:replace-me@mysql:3306/control_plane
  CONTROL_PLANE_API_TOKEN_ADMIN: replace-me
  CONTROL_PLANE_GITHUB_WEBHOOK_SECRET: replace-me
