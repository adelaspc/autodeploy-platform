x-control-plane-env: &control-plane-env
  CONTROL_PLANE_ENV: ${CONTROL_PLANE_ENV:-development}
  CONTROL_PLANE_DATABASE_URL: mysql+pymysql://${CONTROL_PLANE_MYSQL_USER:-control_plane_user}:${CONTROL_PLANE_MYSQL_PASSWORD:-control_plane_password}@db:3306/${CONTROL_PLANE_MYSQL_DATABASE:-control_plane}
  FLASK_APP: wsgi.py
  PORT: ${PORT:-5000}
  CONTROL_PLANE_DEPLOY_HOST: ${CONTROL_PLANE_DEPLOY_HOST:-host.docker.internal}

x-control-plane-base: &control-plane-base
  build:
    context: .
  env_file:
    - .env
  environment:
    <<: *control-plane-env
  volumes:
    - control_plane_workspaces:/tmp/paas-workspaces
  extra_hosts:
    - "host.docker.internal:host-gateway"

services:
  migrate:
    <<: *control-plane-base
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "flask", "--app", "wsgi:app", "db", "upgrade"]
    restart: "no"

  control-plane-api:
    <<: *control-plane-base
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${CONTROL_PLANE_APP_PORT:-5000}:${PORT:-5000}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; import os; urlopen(f'http://127.0.0.1:{os.environ.get(\\\"PORT\\\", \\\"5000\\\")}/health', timeout=3).read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  control-plane-worker:
    <<: *control-plane-base
    volumes:
      - control_plane_workspaces:/tmp/paas-workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "flask", "--app", "wsgi:app", "run-worker"]
    restart: unless-stopped

  control-plane-reconciler:
    <<: *control-plane-base
    volumes:
      - control_plane_workspaces:/tmp/paas-workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "flask", "--app", "wsgi:app", "run-reconciler-loop"]
    restart: unless-stopped

  db:
    image: mysql:8.4
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${CONTROL_PLANE_MYSQL_DATABASE:-control_plane}
      MYSQL_USER: ${CONTROL_PLANE_MYSQL_USER:-control_plane_user}
      MYSQL_PASSWORD: ${CONTROL_PLANE_MYSQL_PASSWORD:-control_plane_password}
      MYSQL_ROOT_PASSWORD: ${CONTROL_PLANE_MYSQL_ROOT_PASSWORD:-root_password}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "${CONTROL_PLANE_MYSQL_PORT:-3306}:3306"
    volumes:
      - control_plane_mysql_data:/var/lib/mysql

volumes:
  control_plane_mysql_data:
  control_plane_workspaces:
