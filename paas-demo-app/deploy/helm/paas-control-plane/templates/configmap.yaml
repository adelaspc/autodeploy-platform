apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "paas-control-plane.fullname" . }}-config
  labels:
    {{- include "paas-control-plane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
