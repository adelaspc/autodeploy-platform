apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "paas-control-plane.fullname" . }}-migrate
  labels:
    {{- include "paas-control-plane.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "paas-control-plane.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      {{- end }}
      {{- if .Values.workspace.initPermissions.enabled }}
      initContainers:
        {{- include "paas-control-plane.workspaceInitContainer" . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "flask", "--app", "wsgi:app", "db", "upgrade"]
          envFrom:
            - configMapRef:
                name: {{ include "paas-control-plane.fullname" . }}-config
            - secretRef:
                name: {{ include "paas-control-plane.fullname" . }}-secret
          volumeMounts:
            - name: workspace
              mountPath: {{ include "paas-control-plane.workspaceMountPath" . }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: workspace
          {{- include "paas-control-plane.workspaceVolume" . | nindent 10 }}
