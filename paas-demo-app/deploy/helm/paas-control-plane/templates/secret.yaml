apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paas-control-plane.fullname" . }}-secret
  labels:
    {{- include "paas-control-plane.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{- if ne ($value | toString) "" }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
